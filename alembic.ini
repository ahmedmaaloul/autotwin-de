# AutoTwin DE — Alembic configuration.
#
# The database URL is NOT set here. `alembic/env.py` reads it from
# `autotwin_core.config.get_settings().database_url_sync`, so migrations, the application and
# the test suite can never disagree about which database they are pointed at.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# 0001_initial_schema.py — zero-padded ordinal, then a slug. Ordinals sort correctly in a
# directory listing, which a timestamp prefix does not do for a human reading a PR.
file_template = %%(rev)s_%%(slug)s

timezone = UTC

[post_write_hooks]
hooks = ruff_format, ruff_fix
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

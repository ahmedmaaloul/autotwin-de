[project]
name = "autotwin-contracts"
version = "0.1.0"
description = "AutoTwin DE — canonical enums, domain records, event envelopes and API DTOs"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autotwin_contracts"]

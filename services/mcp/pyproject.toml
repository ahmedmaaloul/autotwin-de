[project]
name = "autotwin-mcp"
version = "0.1.0"
description = "AutoTwin DE — Model Context Protocol server exposing the platform's analysis tools to any MCP client"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "autotwin-contracts",
    "autotwin-core",
    "autotwin-api",
    "autotwin-ingestion",
    "mcp>=2.2",
]

[tool.uv.sources]
autotwin-contracts = { workspace = true }
autotwin-core = { workspace = true }
autotwin-api = { workspace = true }
autotwin-ingestion = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autotwin_mcp"]

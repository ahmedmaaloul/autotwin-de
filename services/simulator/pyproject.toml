[project]
name = "autotwin-simulator"
version = "0.1.0"
description = "AutoTwin DE — physics-based connected-vehicle telemetry simulator"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "autotwin-contracts",
    "autotwin-core",
    "autotwin-ml",
    # The Kafka-optional TelemetrySink seam (BUILD_SPEC §8) lives in the streaming service. The
    # simulator emits through the interface and never imports aiokafka itself, which is exactly
    # why the dependency points this way and not the other.
    "autotwin-streaming",
    # The ML training set is a Parquet file (BUILD_SPEC §10.2) written by
    # autotwin_simulator.training_data. Declared here rather than relied on transitively through
    # autotwin-ml, because this package imports it directly.
    "polars>=1.17",
]

[tool.uv.sources]
autotwin-contracts = { workspace = true }
autotwin-core = { workspace = true }
autotwin-ml = { workspace = true }
autotwin-streaming = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autotwin_simulator"]

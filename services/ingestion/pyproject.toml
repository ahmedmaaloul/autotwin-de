[project]
name = "autotwin-ingestion"
version = "0.1.0"
description = "AutoTwin DE — official German open-data adapters and ingestion pipelines"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "autotwin-contracts",
    "autotwin-core",
    "httpx>=0.28",
    "polars>=1.17",
    "pyarrow>=18.1",
    "duckdb>=1.1",
    # zoneinfo needs an IANA database to resolve Europe/Berlin, which the Autobahn adapter
    # requires to convert German report times to UTC. Linux and macOS ship one; slim container
    # images and Windows do not, so it is pinned here rather than left to the platform.
    "tzdata>=2024.2",
]

[tool.uv.sources]
autotwin-contracts = { workspace = true }
autotwin-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autotwin_ingestion"]

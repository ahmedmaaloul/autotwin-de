[project]
name = "autotwin-api"
version = "0.1.0"
description = "AutoTwin DE — FastAPI application: REST, SSE telemetry stream and Prometheus metrics"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "autotwin-contracts",
    "autotwin-core",
    "autotwin-ingestion",
    "autotwin-ml",
    "autotwin-simulator",
    "autotwin-streaming",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "prometheus-client>=0.21",
    "sse-starlette>=2.2",
]

[tool.uv.sources]
autotwin-contracts = { workspace = true }
autotwin-core = { workspace = true }
autotwin-ingestion = { workspace = true }
autotwin-ml = { workspace = true }
autotwin-simulator = { workspace = true }
autotwin-streaming = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autotwin_api"]

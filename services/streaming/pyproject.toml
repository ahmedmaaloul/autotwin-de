[project]
name = "autotwin-streaming"
version = "0.1.0"
description = "AutoTwin DE — Redpanda/Kafka producer, consumer and topic management"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "autotwin-contracts",
    "autotwin-core",
    "aiokafka>=0.12",
    # aiokafka only speaks gzip out of the box. cramjam is the single pure-Rust wheel that
    # gives it snappy, lz4 and zstd, and a consumer has no say in the codec a foreign producer
    # picked: `rpk topic produce`, kcat and the Redpanda Console all default to snappy, and an
    # undecodable record batch stalls the whole partition rather than one message.
    "cramjam>=2.8",
]

[tool.uv.sources]
autotwin-contracts = { workspace = true }
autotwin-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autotwin_streaming"]
